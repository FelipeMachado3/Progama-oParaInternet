<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Admin - Blog dos Caneludos</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{

      background:#111;

      color:white;

      font-family:Arial;

      margin:0;

      padding:40px;
    }

    h1{

      color:#00cc66;

      margin-bottom:30px;
    }

    .container{

      max-width:900px;

      margin:auto;
    }

    .form-box{

      background:#1a1a1a;

      padding:30px;

      border-radius:15px;
    }

    label{

      display:block;

      margin-bottom:8px;

      font-weight:bold;
    }

    input,
    textarea,
    select{

      width:100%;

      padding:14px;

      margin-bottom:20px;

      border:none;

      border-radius:8px;

      background:#262626;

      color:white;

      font-size:16px;
    }

    textarea{

      min-height:180px;

      resize:vertical;
    }

    button{

      width:100%;

      background:#00cc66;

      color:white;

      border:none;

      padding:16px;

      border-radius:10px;

      font-size:18px;

      cursor:pointer;

      font-weight:bold;
    }

    button:hover{

      opacity:0.9;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>Painel de Notícias</h1>

  <div class="form-box">

    <!-- CATEGORIA -->

    <label>Categoria</label>

    <select id="categoria">

      <option value="Brasileirão">
        Brasileirão
      </option>

      <option value="Copa do Brasil">
        Copa do Brasil
      </option>

      <option value="Série B">
        Série B
      </option>

      <option value="Estaduais">
        Estaduais
      </option>

      <option value="Copa Libertadores">
        Copa Libertadores
      </option>

      <option value="Copa Sul-Americana">
        Copa Sul-Americana
      </option>

      <option value="Champions League">
        Champions League
      </option>

      <option value="Europa League">
        Europa League
      </option>

      <option value="Premier League">
        Premier League
      </option>

      <option value="La Liga">
        La Liga
      </option>

      <option value="Serie A">
        Serie A
      </option>

      <option value="Transferências">
        Transferências
      </option>

    </select>

    <!-- TÍTULO -->

    <label>Título</label>

    <input
      type="text"
      id="titulo"
      placeholder="Digite o título"
    >

    <!-- SUBTÍTULO -->

    <label>Subtítulo</label>

    <input
      type="text"
      id="subtitulo"
      placeholder="Digite o subtítulo"
    >

    <!-- AUTOR -->

    <label>Autor</label>

    <input
      type="text"
      id="autor"
      placeholder="Autor da notícia"
    >

    <!-- DATA -->

    <label>Data</label>

    <input
      type="text"
      id="data"
      placeholder="Atualizado hoje"
    >

    <!-- IMAGEM PRINCIPAL -->

    <label>Imagem principal</label>

    <input
      type="text"
      id="imagemPrincipal"
      placeholder="imagens/flaXpal.jpg"
    >

    <!-- CONTEÚDO 1 -->

    <label>Primeira parte da notícia</label>

    <textarea
      id="conteudo1"
      placeholder="Digite o texto"
    ></textarea>

    <!-- IMAGEM SECUNDÁRIA -->

    <label>Imagem secundária</label>

    <input
      type="text"
      id="imagemSecundaria"
      placeholder="imagens/noticia1.jpg"
    >

    <!-- CONTEÚDO 2 -->

    <label>Segunda parte da notícia</label>

    <textarea
      id="conteudo2"
      placeholder="Digite o texto"
    ></textarea>

    <!-- BOTÃO -->

    <button onclick="gerarHTML()">
      Gerar HTML
    </button>

  </div>

</div>

<script>

function gerarHTML(){

    const categoria =
      document.getElementById("categoria").value;

    const titulo =
      document.getElementById("titulo").value;

    const subtitulo =
      document.getElementById("subtitulo").value;

    const autor =
      document.getElementById("autor").value;

    const data =
      document.getElementById("data").value;

    const imagemPrincipal =
      document.getElementById("imagemPrincipal").value;

    const conteudo1 =
      document.getElementById("conteudo1").value;

    const imagemSecundaria =
      document.getElementById("imagemSecundaria").value;

    const conteudo2 =
      document.getElementById("conteudo2").value;

    const html = `
<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>${titulo}</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="top-logo">

<a href="index.html" class="logo-area">

<div class="logo-text">

<span class="top">
Blog dos Caneludos
</span>

<span class="sub">
Futebol do jeito certo
</span>

</div>

</a>

</div>

<header>

<nav>

<ul>

<li>

<button class="nav-btn" id="menuToggle">
☰ Menu
</button>

</li>

<li class="nav-spacer"></li>

<li>

<a href="sobre.html" class="nav-link">
Sobre
</a>

</li>

</ul>

</nav>

</header>

<main class="noticia-main">

<article class="noticia-container">

<span class="noticia-categoria">
${categoria}
</span>

<h1>
${titulo}
</h1>

<h2 class="noticia-sub">
${subtitulo}
</h2>

<div class="noticia-meta">

<span>
Por ${autor}
</span>

<span>•</span>

<span>
${data}
</span>

</div>

<img src="${imagemPrincipal}"
class="noticia-img">

<div class="noticia-texto">

<p>
${conteudo1}
</p>

<img src="${imagemSecundaria}"
class="noticia-img">

<p>
${conteudo2}
</p>

</div>

</article>

</main>

</body>

</html>
`;

    // NOME DO ARQUIVO

    const nomeArquivo =
      titulo
      .toLowerCase()
      .replaceAll(" ", "-")
      .replace(/[^\w-]/g, "") + ".html";

    // GERAR DOWNLOAD

    const blob = new Blob([html], {
      type: "text/html"
    });

    const link =
      document.createElement("a");

    link.href =
      URL.createObjectURL(blob);

    link.download =
      nomeArquivo;

    link.click();
}

</script>

</body>

</html>
